[project]
name = "oneerp-qm"
version = "0.1.0"
description = "OneERP QM 클러스터 — maintenance + quality"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.115.0", "uvicorn[standard]>=0.34.0", "oneerp-core"]

[dependency-groups]
dev = ["httpx>=0.28.0", "pytest>=9.0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oneerp_qm_app"]
