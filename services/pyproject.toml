# oneerp-services 독립 레포 uv workspace root
[project]
name = "oneerp-services"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "nats-py>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff==0.15.0",
    "ty==0.0.15",
    "httpx>=0.28.0",
    "anyio>=4.9.0",
    "pymongo>=4.16.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
]

[tool.uv.workspace]
members = [
    "finance/*",
    "hr/*",
    "scm/*",
    "sales/*",
    "platform/*",
    "collab/*",
    "marketing/*",
    "logistics/*",
    "portal/*",
    "compliance/*",
    "assets/*",
    "ehs/*",
]

[tool.uv.sources]
# 개발 시: submodule에서 editable install
# 모노레포 컨텍스트: 상위 core 서브모듈(../core) 사용
# 독립 레포 컨텍스트: services/core (개발자가 수동 clone)
# Docker 빌드 시: UV_EXTRA_INDEX_URL로 PyPI에서 설치 (이 설정 무시)
oneerp-core = { path = "../core", editable = true }

[tool.pytest.ini_options]
# 주의: 각 서비스는 동일 top-level `app` 패키지를 사용하므로 여기서 여러
# 서비스를 한 프로세스로 실행하면 `app.services` namespace 충돌이 발생한다.
# 통합 검증은 CI(ci-be.yml) matrix 에서 서비스별 독립 프로세스로 수행한다.
# 로컬 재현 시에는 `uv run --directory {service} pytest tests/` 권장.
testpaths = [
    "finance", "hr", "scm", "sales", "platform",
    "collab", "marketing", "logistics", "portal",
    "compliance", "assets", "ehs", "tests",
]
addopts = "-q --import-mode=importlib"
consider_namespace_packages = true
markers = [
    "integration: 통합 테스트 (FerretDB 필요)",
    "e2e: E2E 테스트 (배포된 앱 필요)",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["core", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM",
    "S", "RUF", "PT", "TCH", "PERF",
    "C4", "DTZ", "PIE", "RET", "ERA",
    "FA", "ISC", "ICN", "TID", "PTH",
    "FLY", "FURB", "LOG", "G", "T20",
    "ARG", "FBT", "A", "COM", "RSE",
    "SLF", "SLOT",
]
ignore = [
    "E501",
    "COM812",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "ARG", "FBT", "TC002", "TC003", "SLF001"]
"**/models/**/*.py" = ["RUF012"]
"**/routes/**/*.py" = ["TID252", "TC001", "TC002", "FA100", "S101"]
"**/entities.py" = ["TC001", "TC002"]
"**/app/main.py" = ["TID252"]
"scripts/**/*.py" = ["T20", "S112"]
