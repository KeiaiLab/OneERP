openapi: 3.1.0
info:
  title: OneERP Gateway API
  description: OneERP Gateway 서비스 REST API
  contact:
    name: OneERP 개발팀
  license:
    name: Proprietary
  version: 0.1.0
servers:
- url: /
  description: 현재 서버
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      description: 서비스 상태를 확인한다 (하위 호환).
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /health/live:
    get:
      tags:
      - health
      summary: Liveness
      description: Liveness probe — 프로세스 생존 확인.
      operationId: liveness_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Liveness Health Live Get
  /health/ready:
    get:
      tags:
      - health
      summary: Readiness
      description: Readiness probe — DB/NATS/Valkey 연결 포함 서비스 준비 상태 확인.
      operationId: readiness_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/startup:
    get:
      tags:
      - health
      summary: Startup
      description: Startup probe — 서비스 초기화 완료 확인 (readiness와 동일).
      operationId: startup_health_startup_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/addresses:
    post:
      tags:
      - 주소
      summary: Address 생성
      description: 엔티티를 생성한다.
      operationId: address_생성_api_v1_addresses_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Address 생성 Api V1 Addresses Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - 주소
      summary: Address 목록
      description: 엔티티 목록을 페이지네이션으로 조회한다.
      operationId: address_목록_api_v1_addresses_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          default: 20
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_Address_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/addresses/{doc_id}:
    get:
      tags:
      - 주소
      summary: Address 조회
      description: 엔티티를 조회한다.
