[project]
name = "oneerp-hr"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "oneerp-core",
]


[dependency-groups]
dev = ["httpx>=0.28.0", "pytest>=9.0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oneerp_hr_app"]

# G1-4 mutation test 대상: audit_hooks 만 bounded scope 로 측정.
# 실행: cd services/hr/hr && uv run mutmut run
[tool.mutmut]
paths_to_mutate = ["oneerp_hr_app/audit_hooks.py"]
tests_dir = ["tests/unit/test_audit_hooks_mutation.py"]
runner = "uv run pytest -x --timeout=15 tests/unit/test_audit_hooks_mutation.py"

