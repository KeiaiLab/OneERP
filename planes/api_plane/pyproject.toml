[project]
name = "oneerp-plane-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "oneerp-core",
    "oneerp-plane-shared",
    # 마운트 대상 도메인 — plane venv 가 각 도메인의 전이 deps 를 획득하도록
    "oneerp-selling",
    "oneerp-crm",
    "oneerp-pos",
    "oneerp-commerce",
    "oneerp-reservation",
    "oneerp-buying",
    "oneerp-stock",
    "oneerp-manufacturing",
    "oneerp-qm",
    "oneerp-accounting",
    "oneerp-expenses",
    "oneerp-payroll",
    "oneerp-finance_extra",
    "oneerp-hr",
    "oneerp-learning",
    "oneerp-plm",
    "oneerp-assets",
    "oneerp-compliance",
    "oneerp-ehs",
    "oneerp-logistics",
    "oneerp-analytics",
    "oneerp-rpa",
    "oneerp-advanced-planning",
]

[dependency-groups]
dev = ["httpx>=0.28.0", "pytest>=9.0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plane_api"]
