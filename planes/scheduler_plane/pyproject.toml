[project]
name = "oneerp-plane-scheduler"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "oneerp-core",
    "oneerp-plane-shared",
    "oneerp-analytics",
    "oneerp-rpa",
    "oneerp-automation-orchestrator",
    "oneerp-marketing-automation",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plane_scheduler"]
