name: Feature Request
description: 새 기능을 제안합니다
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결 방법
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
  - type: dropdown
    id: module
    attributes:
      label: 관련 모듈
      options:
        - core
        - web (프론트엔드)
        - finance (회계)
        - hr (인사)
        - sales (판매)
        - 신규 모듈
        - 기타
