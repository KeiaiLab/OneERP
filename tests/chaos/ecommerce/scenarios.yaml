apiVersion: chaosmesh.org/v1alpha1
kind: PodChaos
metadata:
  name: ecommerce-pod-kill
  namespace: services-staging
spec:
  action: pod-kill
  mode: one
  duration: "30s"
  selector:
    labelSelectors:
      app: ecommerce
    namespaces: ["services-staging"]
---
apiVersion: chaosmesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: ecommerce-network-delay
  namespace: services-staging
spec:
  action: delay
  mode: one
  duration: "60s"
  selector:
    labelSelectors:
      app: ecommerce
    namespaces: ["services-staging"]
  delay:
    latency: "200ms"
    correlation: "50"
    jitter: "50ms"
