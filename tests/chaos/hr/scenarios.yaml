# chaos-mesh 시나리오 · staging 배포 후 실행
# hr 모듈 · PodChaos + NetworkChaos 조합
apiVersion: chaosmesh.org/v1alpha1
kind: PodChaos
metadata:
  name: hr-pod-kill
  namespace: staging
spec:
  action: pod-kill
  mode: one
  duration: "30s"
  selector:
    labelSelectors:
      app: hr
    namespaces: ["staging"]
  scheduler:
    cron: "@every 5m"
---
apiVersion: chaosmesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: hr-network-delay
  namespace: staging
spec:
  action: delay
  mode: one
  duration: "60s"
  selector:
    labelSelectors:
      app: hr
    namespaces: ["staging"]
  delay:
    latency: "200ms"
    correlation: "50"
    jitter: "50ms"
  scheduler:
    cron: "@every 10m"
