# G2-4 chaos scenario · staging 전용
# source: docs/kb/incident/chaos-compliance-2026-04-22.md
# conducted_at: 2026-04-22T08:15:00Z
# expected_mttr_minutes: 10
apiVersion: chaosmesh.org/v1alpha1
kind: PodChaos
metadata:
  name: compliance-pod-kill
  namespace: services-staging
spec:
  action: pod-kill
  mode: one
  duration: "30s"
  selector:
    labelSelectors:
      app: compliance
    namespaces: ["services-staging"]
---
apiVersion: chaosmesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: compliance-network-delay
  namespace: services-staging
spec:
  action: delay
  mode: one
  duration: "60s"
  selector:
    labelSelectors:
      app: compliance
    namespaces: ["services-staging"]
  delay:
    latency: "200ms"
    correlation: "50"
    jitter: "50ms"
