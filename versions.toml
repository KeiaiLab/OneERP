biome            = "2.0.0"
node             = "22"
fastapi          = ">=0.115.0"
pydantic         = ">=2.11.0"
next             = "16"
tailwindcss      = "4.1"
ferretdb         = "2.7.0"
ferretdb_postgres = "17-0.107.0-ferretdb-2.7.0"

[metadata]
