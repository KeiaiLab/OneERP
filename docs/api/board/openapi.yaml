        대상자별 ReadConfirmation(status=unread) 자동 생성.

        BR-BRD-011: 마감일 3일/1일 전 미확인자에게 리마인더 자동 발송.'
      properties:
        _id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          default: ''
          title: Created By
          type: string
        docstatus:
          $ref: '#/components/schemas/DocStatus'
          default: 0
