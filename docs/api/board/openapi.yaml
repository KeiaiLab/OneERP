          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Reminded At
        post_id:
          default: ''
          title: Post Id
          type: string
        read_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Read At
        reminder_count:
          default: 0
          title: Reminder Count
          type: integer
        status:
          $ref: '#/components/schemas/ReadStatus'
          default: unread
        tenant_id:
          title: Tenant Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        updated_by:
          default: ''
          title: Updated By
          type: string
        user_id:
          default: ''
          title: User Id
          type: string
      title: ReadConfirmation
      type: object
    ReadConfirmationCreate:
