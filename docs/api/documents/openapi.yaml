components:
  schemas:
    AuditAction:
      description: 감사 로그 행위 유형.
      enum:
      - create
      - read
      - update
      - delete
      - download
      - share
      - sign
      - checkout
      - checkin
      - submit
      - approve
      - reject
      - publish
      - archive
      - dispose
      - restore_version
      - access_denied
      title: AuditAction
      type: string
    DocStatus:
      description: 문서 상태 — ERPNext 호환.
      enum:
      - 0
      - 1
      - 2
      title: DocStatus
      type: integer
    DocumentAuditLog:
      description: '문서 감사 로그 엔티티.


        문서에 대한 모든 접근/변경 행위를 기록한다.

        감사 추적 및 보안 모니터링에 사용한다.'
      properties:
        _id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        action:
          $ref: '#/components/schemas/AuditAction'
          default: read
        actor:
          default: ''
          title: Actor
          type: string
        actor_ip:
          default: ''
          title: Actor Ip
          type: string
        actor_user_agent:
          default: ''
          title: Actor User Agent
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          default: ''
          title: Created By
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        docstatus:
          $ref: '#/components/schemas/DocStatus'
          default: 0
        document_id:
          default: ''
          title: Document Id
          type: string
        new_state:
          additionalProperties: true
          title: New State
          type: object
        previous_state:
          additionalProperties: true
          title: Previous State
          type: object
        tenant_id:
          title: Tenant Id
          type: string
        timestamp:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Timestamp
        updated_at:
          format: date-time
          title: Updated At
          type: string
        updated_by:
          default: ''
          title: Updated By
          type: string
      title: DocumentAuditLog
      type: object
    DocumentAuditLogCreate:
      description: 감사 로그 생성 요청 스키마.
      properties:
        action:
          $ref: '#/components/schemas/AuditAction'
          description: 행위 유형
        actor:
          description: 행위자
          title: Actor
          type: string
        actor_ip:
          default: ''
          description: 접속 IP
          title: Actor Ip
          type: string
        actor_user_agent:
          default: ''
          description: 브라우저/앱 정보
          title: Actor User Agent
          type: string
        details:
          additionalProperties: true
          description: 상세 정보
          title: Details
          type: object
        document_id:
          description: 문서 ID
          title: Document Id
          type: string
        new_state:
          additionalProperties: true
          title: New State
          type: object
        previous_state:
          additionalProperties: true
          title: Previous State
          type: object
      required:
      - document_id
      - action
      - actor
      title: DocumentAuditLogCreate
      type: object
    DocumentAuditLogUpdate:
      description: 감사 로그 수정 스키마 (일반적으로 사용하지 않음 — 로그는 불변).
      properties:
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
      title: DocumentAuditLogUpdate
      type: object
    DocumentCategory:
      description: '문서 분류 엔티티.


        계층형 문서 분류 체계를 정의한다. 최대 10단계 계층 지원.'
      properties:
        _id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        code:
          default: ''
          title: Code
          type: string
        company:
          default: ''
          title: Company
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          default: ''
          title: Created By
          type: string
        default_retention_policy:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Retention Policy
        default_security_level:
          default: internal
          title: Default Security Level
          type: string
        depth:
          default: 0
          title: Depth
          type: integer
        description:
          default: ''
          title: Description
          type: string
        docstatus:
          $ref: '#/components/schemas/DocStatus'
          default: 0
        document_count:
          default: 0
          title: Document Count
          type: integer
        is_active:
          default: true
          title: Is Active
          type: boolean
        is_deleted:
          default: false
          title: Is Deleted
          type: boolean
        metadata_schema:
          additionalProperties: true
          title: Metadata Schema
          type: object
        name:
          default: ''
          title: Name
          type: string
        parent_category:
          anyOf:
          - type: string
          - type: 'null'
