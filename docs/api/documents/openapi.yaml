        path:
          default: ''
          title: Path
          type: string
        sort_order:
          default: 0
          title: Sort Order
          type: integer
        tenant_id:
          title: Tenant Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        updated_by:
          default: ''
          title: Updated By
          type: string
      title: DocumentCategory
      type: object
    DocumentCategoryCreate:
      description: 문서 분류 생성 요청 스키마.
      properties:
        code:
          description: 분류 코드
          maxLength: 20
          minLength: 3
          title: Code
          type: string
        company:
          default: ''
          description: 회사 ID
          title: Company
          type: string
        default_retention_policy:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Retention Policy
        default_security_level:
          default: internal
          title: Default Security Level
          type: string
        description:
          default: ''
          description: 설명
          maxLength: 1000
          title: Description
          type: string
        metadata_schema:
          additionalProperties: true
          title: Metadata Schema
          type: object
        name:
          description: 분류명
          maxLength: 200
          minLength: 1
          title: Name
          type: string
        parent_category:
          anyOf:
          - type: string
          - type: 'null'
          description: 상위 분류 ID
          title: Parent Category
        sort_order:
          default: 0
          title: Sort Order
          type: integer
      required:
      - name
      - code
      title: DocumentCategoryCreate
      type: object
    DocumentCategoryUpdate:
      description: 문서 분류 수정 요청 스키마.
      properties:
        default_retention_policy:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Retention Policy
        default_security_level:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Security Level
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
        metadata_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata Schema
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        sort_order:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sort Order
      title: DocumentCategoryUpdate
      type: object
    DocumentCreate:
      description: 문서 생성 요청 스키마.
      properties:
        category:
          description: 문서 분류 ID
          minLength: 1
          title: Category
          type: string
        company:
          default: ''
          description: 회사 ID
          title: Company
          type: string
        content:
          default: ''
          description: 리치텍스트 HTML 내용
          title: Content
          type: string
        department:
          default: ''
          description: 소속 부서
          title: Department
          type: string
        metadata:
          additionalProperties: true
          description: 확장 메타데이터
          title: Metadata
          type: object
        security_level:
          $ref: '#/components/schemas/SecurityLevel'
          default: internal
          description: 보안 등급
        summary:
          default: ''
          description: 문서 요약
          maxLength: 2000
          title: Summary
          type: string
        tags:
          description: 태그 목록
          items:
            type: string
          title: Tags
          type: array
        template_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 템플릿 ID
          title: Template Id
        template_variables:
          additionalProperties:
            type: string
          description: 템플릿 변수 바인딩
          title: Template Variables
          type: object
        title:
          description: 문서 제목
          maxLength: 500
          minLength: 1
          title: Title
          type: string
      required:
      - title
      - category
      title: DocumentCreate
      type: object
    DocumentShare:
      description: '문서 공유 엔티티.


        문서의 공유 설정을 관리한다. 내부 사용자 지정 및 외부 링크 공유를 지원한다.'
