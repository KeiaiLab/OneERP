        external_link_token:
          anyOf:
          - type: string
          - type: 'null'
          title: External Link Token
        is_active:
          default: true
          title: Is Active
          type: boolean
        max_downloads:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Downloads
        permission:
          $ref: '#/components/schemas/SharePermission'
          default: viewer
        share_type:
          $ref: '#/components/schemas/ShareType'
          default: user
        shared_by:
          default: ''
          title: Shared By
          type: string
        target_department:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Department
        target_user:
          anyOf:
          - type: string
          - type: 'null'
          title: Target User
        tenant_id:
          title: Tenant Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        updated_by:
          default: ''
          title: Updated By
          type: string
      title: DocumentShare
      type: object
    DocumentShareCreate:
      description: 문서 공유 생성 요청 스키마.
      properties:
        document_id:
          description: 문서 참조 ID
          title: Document Id
          type: string
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 만료일
          title: Expires At
        max_downloads:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          description: 최대 다운로드 횟수
          title: Max Downloads
        password:
          anyOf:
          - type: string
          - type: 'null'
          description: 외부 링크 암호
          title: Password
        permission:
          $ref: '#/components/schemas/SharePermission'
          default: viewer
          description: 권한 수준
        share_type:
          $ref: '#/components/schemas/ShareType'
          description: 공유 유형
        target_department:
          anyOf:
          - type: string
          - type: 'null'
          description: 대상 부서
          title: Target Department
        target_user:
          anyOf:
          - type: string
          - type: 'null'
          description: 대상 사용자
          title: Target User
      required:
      - document_id
      - share_type
      title: DocumentShareCreate
      type: object
    DocumentShareUpdate:
      description: 문서 공유 수정 요청 스키마.
      properties:
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
        max_downloads:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Downloads
        permission:
          anyOf:
          - $ref: '#/components/schemas/SharePermission'
