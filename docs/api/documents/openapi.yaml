            type: string
          - type: 'null'
          title: Invalidated At
        invalidated_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Invalidated By
        invalidated_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Invalidated Reason
        is_valid:
          default: true
          title: Is Valid
          type: boolean
        signature_data:
          default: ''
          title: Signature Data
          type: string
        signature_type:
          $ref: '#/components/schemas/SignatureType'
          default: joint_certificate
        signed_at:
          anyOf:
          - format: date-time
            type: string
