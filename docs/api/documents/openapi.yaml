          - type: string
          - type: 'null'
          title: Id
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          default: ''
          title: Created By
          type: string
        docstatus:
          $ref: '#/components/schemas/DocStatus'
          default: 0
        document_id:
          default: ''
          title: Document Id
          type: string
        download_count:
          default: 0
