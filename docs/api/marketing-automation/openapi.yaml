info:
  contact:
    name: OneERP 개발팀
  description: OneERP Marketing-automation 서비스 REST API
  license:
    name: Proprietary
  title: OneERP Marketing-automation API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/marketing/analytics:
    get:
      description: 엔티티 목록을 페이지네이션으로 조회한다.
      operationId: campaign_analytics_목록_api_v1_marketing_analytics_get
      parameters:
      - in: query
        name: page
        required: false
        schema:
          default: 1
          title: Page
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          title: Page Size
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_CampaignAnalytics_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Campaign Analytics 목록
      tags:
      - 캠페인분석
    post:
      description: 엔티티를 생성한다.
      operationId: campaign_analytics_생성_api_v1_marketing_analytics_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignAnalyticsCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Campaign Analytics 생성 Api V1 Marketing Analytics Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Campaign Analytics 생성
      tags:
      - 캠페인분석
  /api/v1/marketing/analytics/{doc_id}:
    delete:
      description: 엔티티를 삭제한다. 초안 상태에서만 허용.
      operationId: campaign_analytics_삭제_api_v1_marketing_analytics__doc_id__delete
      parameters:
      - in: path
        name: doc_id
        required: true
        schema:
          title: Doc Id
          type: string
      responses:
        '204':
