            $ref: '#/components/schemas/PollOption'
          minItems: 2
          title: Options
          type: array
        poll_type:
          $ref: '#/components/schemas/PollType'
          description: 투표 유형
        show_results:
          $ref: '#/components/schemas/PollShowResults'
          default: realtime
          description: 결과 공개 시점
        title:
