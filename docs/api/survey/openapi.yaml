          maxLength: 500
          minLength: 1
          title: Title
          type: string
      required:
      - title
      - poll_type
      - options
      title: PollCreate
      type: object
    PollOption:
      description: 투표 선택지 — 임베디드.
      properties:
        option_id:
          description: 선택지 ID
