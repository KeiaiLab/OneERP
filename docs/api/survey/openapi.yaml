    Poll:
      description: 투표 문서.
      properties:
        _id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        anonymity:
          default: named
          title: Anonymity
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          default: ''
          title: Created By
          type: string
        docstatus:
          $ref: '#/components/schemas/DocStatus'
          default: 0
        ends_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Ends At
        options:
          items:
            $ref: '#/components/schemas/PollOption'
          title: Options
          type: array
        poll_type:
          $ref: '#/components/schemas/PollType'
          default: single_choice
        show_results:
          $ref: '#/components/schemas/PollShowResults'
          default: realtime
        status:
          $ref: '#/components/schemas/PollStatus'
          default: active
        tenant_id:
          title: Tenant Id
          type: string
        title:
          default: ''
          title: Title
          type: string
        total_votes:
          default: 0
          title: Total Votes
          type: integer
        updated_at:
          format: date-time
          title: Updated At
          type: string
        updated_by:
          default: ''
          title: Updated By
          type: string
      title: Poll
      type: object
    PollCreate:
      description: 투표 생성 요청 스키마.
      properties:
        anonymity:
          default: named
          description: 익명/기명
          title: Anonymity
          type: string
        ends_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 마감 시각
          title: Ends At
        options:
          description: 선택지 (최소 2개)
