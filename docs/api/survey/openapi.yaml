components:
  schemas:
    Anonymity:
      description: 익명/기명 구분.
      enum:
      - anonymous
      - named
      title: Anonymity
      type: string
    Answer:
      description: 답변 — 임베디드.
      properties:
        date_value:
          anyOf:
          - type: string
          - type: 'null'
          description: 날짜 답변
          title: Date Value
        matrix_values:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          description: 매트릭스 값
          title: Matrix Values
        nps_value:
          anyOf:
          - type: integer
          - type: 'null'
          description: NPS 값 (0~10)
          title: Nps Value
        question_id:
          description: 질문 ID
          title: Question Id
          type: string
        scale_value:
          anyOf:
          - type: integer
          - type: 'null'
          description: 척도 값
          title: Scale Value
        selected_options:
          description: 선택한 option_id
          items:
            type: string
          title: Selected Options
          type: array
        text_value:
          anyOf:
          - type: string
          - type: 'null'
          description: 텍스트 답변
          title: Text Value
      required:
      - question_id
      title: Answer
      type: object
    DocStatus:
      description: 문서 상태 — ERPNext 호환.
      enum:
      - 0
      - 1
      - 2
      title: DocStatus
      type: integer
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LogicAction:
      description: 조건부 로직 액션.
      enum:
      - jump_to
      - skip
      - end_survey
      title: LogicAction
      type: string
    LogicRule:
      description: 조건부 로직 규칙 — 임베디드.
      properties:
        action:
          $ref: '#/components/schemas/LogicAction'
          description: 액션
        condition_option_id:
          description: 조건 선택지 ID
          title: Condition Option Id
          type: string
        target_question_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 이동 대상 질문 ID
          title: Target Question Id
      required:
      - condition_option_id
      - action
      title: LogicRule
      type: object
    PaginatedResponse_PollVote_:
