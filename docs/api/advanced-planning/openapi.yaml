paths:
  /api/v1/planning/balance:
    get:
      description: 수요-공급 밸런싱을 수행한다.
      operationId: balance_demand_supply_api_v1_planning_balance_get
      parameters:
      - in: query
        name: item_code
        required: false
        schema:
          default: ''
          title: Item Code
          type: string
      - in: query
        name: warehouse
        required: false
        schema:
          default: ''
          title: Warehouse
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Balance Demand Supply Api V1 Planning Balance Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Balance Demand Supply
      tags:
      - 계획최적화
  /api/v1/planning/capacity-plans:
    get:
      description: 엔티티 목록을 페이지네이션으로 조회한다.
      operationId: capacity_plan_목록_api_v1_planning_capacity_plans_get
      parameters:
