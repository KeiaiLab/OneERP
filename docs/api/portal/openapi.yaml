components:
  schemas:
    Announcement:
      description: '공지사항 문서.


        BR-PTL-004: 필수 공지사항은 닫기 버튼 없이 표시.

        BR-PTL-005: 선택 공지는 ''오늘 하루 보지 않기'' 가능.

        BR-PTL-006: 긴급 공지는 빨간 배너로 최상단 표시.'
      properties:
        _id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        content:
          default: ''
          title: Content
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          default: ''
          title: Created By
          type: string
        docstatus:
          $ref: '#/components/schemas/DocStatus'
          default: 0
        end_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: End Date
        is_mandatory:
          default: false
          title: Is Mandatory
          type: boolean
        priority:
          $ref: '#/components/schemas/AnnouncementPriority'
          default: normal
        published_by:
          default: ''
          title: Published By
          type: string
        read_count:
          default: 0
          title: Read Count
          type: integer
        start_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Start Date
        status:
          $ref: '#/components/schemas/AnnouncementStatus'
          default: draft
        target_departments:
          items:
            type: string
          title: Target Departments
          type: array
        target_roles:
          items:
            type: string
          title: Target Roles
          type: array
        tenant_id:
          title: Tenant Id
          type: string
        title:
          default: ''
          title: Title
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        updated_by:
          default: ''
          title: Updated By
          type: string
      title: Announcement
      type: object
    AnnouncementCreate:
      description: 공지사항 생성 요청 스키마.
      properties:
        content:
          description: 내용
          minLength: 1
          title: Content
          type: string
        end_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 게시 종료일
          title: End Date
        is_mandatory:
          default: false
          description: 필수 공지 여부 (BR-PTL-004)
          title: Is Mandatory
          type: boolean
        priority:
          $ref: '#/components/schemas/AnnouncementPriority'
          default: normal
          description: 우선순위
        start_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 게시 시작일
          title: Start Date
        target_departments:
          description: 대상 부서 (빈 목록=전체)
          items:
            type: string
          title: Target Departments
          type: array
        target_roles:
          description: 대상 역할 (빈 목록=전체)
          items:
            type: string
          title: Target Roles
          type: array
        title:
          description: 제목
          maxLength: 200
          minLength: 1
          title: Title
          type: string
      required:
      - title
      - content
      title: AnnouncementCreate
      type: object
    AnnouncementPriority:
      description: 공지사항 우선순위.
      enum:
      - low
      - normal
      - high
      - urgent
      title: AnnouncementPriority
      type: string
    AnnouncementRead:
      description: '공지사항 읽음 문서.


        BR-PTL-005: hide_until로 ''오늘 하루 보지 않기'' 구현.'
      properties:
        _id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        announcement_id:
          default: ''
          title: Announcement Id
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          default: ''
          title: Created By
          type: string
        docstatus:
          $ref: '#/components/schemas/DocStatus'
          default: 0
        hide_until:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Hide Until
        read_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Read At
        tenant_id:
          title: Tenant Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        updated_by:
          default: ''
          title: Updated By
          type: string
        user_id:
          default: ''
          title: User Id
          type: string
      title: AnnouncementRead
      type: object
    AnnouncementReadCreate:
      description: 공지사항 읽음 생성 요청 스키마.
      properties:
        announcement_id:
          description: 공지사항 ID
          title: Announcement Id
          type: string
        hide_until:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 숨김 만료일 (오늘 하루 보지 않기)
          title: Hide Until
        user_id:
          default: ''
          description: 사용자 ID (서버에서 설정)
          title: User Id
          type: string
      required:
      - announcement_id
      title: AnnouncementReadCreate
      type: object
    AnnouncementReadUpdate:
      description: 공지사항 읽음 수정 요청 스키마.
      properties:
        hide_until:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Hide Until
      title: AnnouncementReadUpdate
      type: object
    AnnouncementStatus:
      description: 공지사항 상태.
      enum:
      - draft
      - active
      - expired
      - archived
      title: AnnouncementStatus
      type: string
    AnnouncementUpdate:
      description: 공지사항 수정 요청 스키마.
      properties:
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
        end_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: End Date
        is_mandatory:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Mandatory
        priority:
          anyOf:
          - $ref: '#/components/schemas/AnnouncementPriority'
          - type: 'null'
        start_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Start Date
        status:
          anyOf:
          - $ref: '#/components/schemas/AnnouncementStatus'
          - type: 'null'
        target_departments:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Target Departments
        target_roles:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Target Roles
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      title: AnnouncementUpdate
      type: object
    Bookmark:
      description: '북마크 문서.


        BR-MSG-050 규칙을 따른다.'
      properties:
        _id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        channel_id:
          default: ''
          title: Channel Id
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          default: ''
          title: Created By
          type: string
        docstatus:
          $ref: '#/components/schemas/DocStatus'
          default: 0
        message_id:
          default: ''
          title: Message Id
          type: string
        note:
          default: ''
          title: Note
          type: string
        tenant_id:
          title: Tenant Id
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        updated_by:
          default: ''
          title: Updated By
          type: string
        user_id:
          default: ''
          title: User Id
          type: string
      title: Bookmark
      type: object
    BookmarkCreate:
      description: '북마크 생성 요청 스키마.


        BR-MSG-050: 동일 메시지 중복 북마크 금지.'
      properties:
        channel_id:
          title: Channel Id
          type: string
        message_id:
          title: Message Id
          type: string
        note:
          default: ''
          title: Note
          type: string
        user_id:
          title: User Id
          type: string
      required:
      - user_id
      - message_id
      - channel_id
      title: BookmarkCreate
      type: object
    BookmarkUpdate:
      description: 북마크 수정 요청 스키마.
      properties:
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      title: BookmarkUpdate
      type: object
    ChannelCreate:
      description: '채널 생성 요청 스키마.


        BR-MSG-001: 채널명은 2~100자 이내.

        BR-MSG-002: 채널 유형은 public/private/direct 중 하나.'
      properties:
        channel_name:
          maxLength: 100
          minLength: 2
          title: Channel Name
          type: string
        channel_type:
          $ref: '#/components/schemas/ChannelType'
          default: public
        description:
          default: ''
          title: Description
          type: string
        members:
          items:
            type: string
          title: Members
          type: array
        owner_id:
          default: ''
          title: Owner Id
          type: string
      required:
      - channel_name
      title: ChannelCreate
      type: object
    ChannelStatus:
      description: 채널 상태.
      enum:
      - active
      - archived
      title: ChannelStatus
      type: string
    ChannelType:
      description: 채널 유형.
      enum:
      - public
      - private
      - direct
      title: ChannelType
      type: string
    ChannelUpdate:
      description: 채널 수정 요청 스키마.
      properties:
        channel_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Channel Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        status:
          anyOf:
          - $ref: '#/components/schemas/ChannelStatus'
          - type: 'null'
      title: ChannelUpdate
      type: object
    DocStatus:
      description: 문서 상태 — ERPNext 호환.
      enum:
      - 0
      - 1
      - 2
      title: DocStatus
      type: integer
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LayoutScope:
      description: 레이아웃 적용 범위.
      enum:
      - global
      - department
      - role
      - personal
      title: LayoutScope
      type: string
    MessageCreate:
      description: '메시지 생성 요청 스키마.


        BR-MSG-010: 메시지 본문은 1~10000자 이내.

        BR-MSG-011: 메시지 유형은 text/file/system/reply 중 하나.

        BR-MSG-012: reply 유형은 parent_message_id가 필수.'
      properties:
        channel_id:
          title: Channel Id
          type: string
        content:
          maxLength: 10000
          minLength: 1
          title: Content
          type: string
        file_name:
          anyOf:
          - type: string
          - type: 'null'
          title: File Name
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
        mentions:
          items:
            type: string
          title: Mentions
          type: array
        message_type:
          $ref: '#/components/schemas/MessageType'
          default: text
        parent_message_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Message Id
        sender_id:
          title: Sender Id
          type: string
      required:
      - channel_id
      - sender_id
      - content
      title: MessageCreate
      type: object
    MessageType:
      description: 메시지 유형.
      enum:
      - text
      - file
      - system
      - reply
      title: MessageType
      type: string
    MessageUpdate:
      description: 메시지 수정 요청 스키마.
      properties:
        content:
          anyOf:
          - maxLength: 10000
            minLength: 1
            type: string
          - type: 'null'
          title: Content
      title: MessageUpdate
      type: object
    MobileLayoutConfig:
      description: '모바일 레이아웃 설정.


        BR-PTL-013: 모바일 자동 리플로우 설정.'
      properties:
        columns:
          default: 1
          description: 모바일 컬럼 수
          maximum: 4.0
          minimum: 1.0
          title: Columns
          type: integer
        hide_widgets:
          description: 모바일에서 숨길 위젯 ID 목록
          items:
            type: string
          title: Hide Widgets
          type: array
        stack_order:
          description: 위젯 스택 순서 (widget_id 목록)
          items:
