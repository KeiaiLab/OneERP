components:
  schemas:
    Attachment:
      description: 첨부파일 정보.
      properties:
        file_name:
          title: File Name
          type: string
        file_size:
          default: 0
          title: File Size
          type: integer
        file_url:
          title: File Url
          type: string
        mime_type:
          default: ''
          title: Mime Type
          type: string
      required:
      - file_name
      - file_url
      title: Attachment
      type: object
