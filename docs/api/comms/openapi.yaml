        entries:
          items:
            additionalProperties: true
            type: object
          title: Entries
          type: array
      required:
      - entries
      title: BatchRegisterRequest
      type: object
    DirectoryEntryStatus:
      description: 인명부 엔트리 상태.
      enum:
      - active
      - on_leave
      - transferred
      - resigned
      title: DirectoryEntryStatus
      type: string
    DocStatus:
      description: 문서 상태 — ERPNext 호환.
      enum:
      - 0
      - 1
      - 2
      title: DocStatus
      type: integer
    EmployeeDirectory:
