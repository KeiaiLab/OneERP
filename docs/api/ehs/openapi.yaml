paths:
  /api/v1/hazardous-materials:
    get:
      description: 엔티티 목록을 페이지네이션으로 조회한다.
      operationId: hazardous_material_목록_api_v1_hazardous_materials_get
      parameters:
      - in: query
        name: page
        required: false
        schema:
          default: 1
          title: Page
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          title: Page Size
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_HazardousMaterial_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Hazardous Material 목록
      tags:
      - 위험물
    post:
      description: 엔티티를 생성한다.
      operationId: hazardous_material_생성_api_v1_hazardous_materials_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HazardousMaterialCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
