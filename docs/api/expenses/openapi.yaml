components:
  schemas:
    CorporateCardCreate:
      description: 법인카드 생성 요청 스키마.
      properties:
        card_number:
          title: Card Number
          type: string
        card_type:
          default: credit
          title: Card Type
          type: string
        credit_limit:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          default: '0'
          title: Credit Limit
        employee_id:
          title: Employee Id
          type: string
        is_active:
          default: true
          title: Is Active
          type: boolean
      required:
      - card_number
      - employee_id
      title: CorporateCardCreate
      type: object
    CorporateCardTransactionCreate:
      description: 법인카드거래 생성 요청 스키마.
      properties:
        amount:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          default: '0'
          title: Amount
        card_number:
          title: Card Number
          type: string
        merchant:
          default: ''
          title: Merchant
          type: string
        transaction_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Transaction Date
      required:
      - card_number
      title: CorporateCardTransactionCreate
      type: object
    CorporateCardUpdate:
      description: 법인카드 수정 요청 스키마.
      properties:
        card_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Card Number
        card_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Card Type
        credit_limit:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Credit Limit
        employee_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Employee Id
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
      title: CorporateCardUpdate
      type: object
    ExpenseClaimCreate:
      description: '경비청구 생성 요청 스키마.


        E2E 흐름에서 사용하는 필드:

        - employee_id, employee_name, posting_date

        - expense_type_id: 경비유형 참조

        - expenses: 간편 항목 목록 (ExpenseClaimItem로 변환)

        - total_claimed_amount: 총 청구 금액

        - items: 기존 라인아이템 (직접 지정 시)'
      properties:
        approval_status:
          default: pending
          title: Approval Status
          type: string
        employee_id:
          title: Employee Id
          type: string
        employee_name:
          default: ''
          title: Employee Name
          type: string
        expense_type_id:
          default: ''
          title: Expense Type Id
          type: string
        expenses:
          items:
            additionalProperties: true
            type: object
          title: Expenses
          type: array
        items:
          items:
            additionalProperties: true
            type: object
          title: Items
          type: array
        posting_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Posting Date
        total_amount:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          default: '0'
          title: Total Amount
        total_claimed_amount:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          default: '0'
          title: Total Claimed Amount
      required:
      - employee_id
      title: ExpenseClaimCreate
      type: object
    ExpenseClaimUpdate:
      description: 경비청구 수정 요청 스키마.
      properties:
        approval_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Approval Status
        employee_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Employee Id
        employee_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Employee Name
        expense_type_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Expense Type Id
        expenses:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Expenses
        items:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Items
        posting_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Posting Date
        total_amount:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Total Amount
        total_claimed_amount:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Total Claimed Amount
      title: ExpenseClaimUpdate
      type: object
    ExpenseTypeCreate:
      description: 경비유형 생성 요청 스키마.
      properties:
        account:
          default: ''
          title: Account
          type: string
        description:
          default: ''
          title: Description
          type: string
        expense_type_name:
          title: Expense Type Name
          type: string
        is_active:
          default: true
          title: Is Active
          type: boolean
      required:
      - expense_type_name
      title: ExpenseTypeCreate
      type: object
    ExpenseTypeUpdate:
      description: 경비유형 수정 요청 스키마.
      properties:
        account:
          anyOf:
          - type: string
          - type: 'null'
          title: Account
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        expense_type_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Expense Type Name
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
      title: ExpenseTypeUpdate
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    TravelRequestCreate:
      description: 출장신청 생성 요청 스키마.
      properties:
        departure_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Departure Date
        destination:
          default: ''
          title: Destination
          type: string
        employee_id:
          title: Employee Id
          type: string
        estimated_cost:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          default: '0'
          title: Estimated Cost
        purpose:
          default: ''
          title: Purpose
          type: string
        return_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Return Date
      required:
      - employee_id
      title: TravelRequestCreate
      type: object
    TravelRequestUpdate:
      description: 출장신청 수정 요청 스키마.
      properties:
        departure_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Departure Date
        destination:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination
        employee_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Employee Id
        estimated_cost:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Estimated Cost
        purpose:
          anyOf:
          - type: string
          - type: 'null'
          title: Purpose
        return_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Return Date
      title: TravelRequestUpdate
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    _ActualExpenseItem:
      description: 출장 정산 실제 경비 항목.
      properties:
        amount:
          title: Amount
          type: number
        description:
          default: ''
          title: Description
          type: string
        expense_type:
          title: Expense Type
          type: string
      required:
      - expense_type
      - amount
      title: _ActualExpenseItem
      type: object
    _SettleTravelBody:
      description: 출장 정산 요청 바디.
      properties:
        actual_expenses:
          items:
            $ref: '#/components/schemas/_ActualExpenseItem'
          title: Actual Expenses
          type: array
      required:
      - actual_expenses
      title: _SettleTravelBody
      type: object
